<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo: Arena Fight</title>
<style>
:root{--bg:#eee;--fg:#111;--bt:#d9dce6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0807;--fg:#eee;--bt:#2a2220}}
:root[data-theme="dark"]{--bg:#0a0807;--fg:#eee;--bt:#2a2220}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
#w{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}

#ctl{display:flex;justify-content:space-between;align-items:center;width:min(100%,430px);padding:6px 12px 8px;box-sizing:border-box}
#pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:5px}
#u{grid-column:2}#l{grid-row:2}#d{grid-row:2;grid-column:2}#r{grid-row:2;grid-column:3}
#act{display:flex;gap:10px;align-items:center}
button{background:var(--bt);color:var(--fg);border:0;border-radius:14px;font-size:22px;touch-action:none;padding:0}
#pad button{width:52px;height:52px}
#k{width:68px;height:68px;background:#355c7d;color:#fff}#p{width:96px;height:96px;border-radius:50%;background:#d62828;color:#fff;font-size:34px}
button:active{filter:brightness(1.5)}
</style></head><body>
